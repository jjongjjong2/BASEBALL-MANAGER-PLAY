<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>베이스볼 매니저 프로토타입</title>
<meta name="description" content="KBO 단장·감독 시뮬레이션 프로토타입">
<meta name="theme-color" content="#0b1015">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="베이스볼 매니저">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
html { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* 야간 경기장 전광판: 남색 바탕 + 앰버 전구색 포인트. 가로 화면 우선, 세로에서는 쌓아서 스크롤 */
:root {
  color-scheme: dark;
  --bg: #0b1015;
  --panel: #121920;
  --panel2: #18212a;
  --line: #222d38;
  --line2: #2f3c49;
  --ink: #e9eef3;
  --muted: #98a4b0;
  --dim: #6d7a86;
  --accent: #f2b544;
  --accent-ink: #1b1408;
  --accent-soft: rgba(242, 181, 68, 0.14);
  --opp: #78b6ea;
  --good: #6fd39a;
  --warn: #f2955b;
  --bad: #ec6b6b;
  --grass: #13261b;
  --dirt: #2a2218;
  --elite: #ffd47e;
  --font: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --num: 'Barlow Condensed', 'IBM Plex Sans KR', system-ui, sans-serif;
  --r: 10px;
}

html, body, #root { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 13px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.strong { font-weight: 700; }
.good { color: var(--good); }
.bad { color: var(--bad); }
.pad { padding: 8px 4px; margin: 0; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); margin: 0; }
.t-elite { color: var(--elite); }
.t-good { color: var(--accent); }
.t-avg { color: var(--ink); }
.t-low { color: var(--dim); }

.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  overflow: hidden;
}
.rotate-hint { display: none; }

/* --- 공통 버튼 --- */
.btn { min-height: 40px; padding: 0 14px; border-radius: var(--r); border: 1px solid var(--line2); background: var(--panel2); font-weight: 500; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); }
.btn.big { min-height: 46px; font-size: 15px; padding: 0 18px; }
.btn.ghost { background: transparent; }
.btn.on { border-color: var(--accent); color: var(--accent); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #1a0909; font-weight: 700; }
.btn:disabled { opacity: 0.45; }
.icon-btn { min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line2); background: transparent; color: var(--ink); font-size: 12.5px; position: relative; }
.back { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line2); background: transparent; font-size: 22px; line-height: 1; flex: none; }
.linkish { background: none; border: 0; color: var(--opp); padding: 0 4px; text-decoration: underline; text-underline-offset: 2px; font-size: 12px; }
.pname { background: none; border: 0; padding: 0; text-align: left; color: inherit; font-weight: inherit; }
.pname:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.badge { display: inline-block; margin-left: 5px; vertical-align: 1px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; line-height: 18px; }
.chip { display: inline-block; align-self: flex-start; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line2); color: var(--muted); font-size: 11px; }
.ovr { display: inline-block; min-width: 26px; padding: 0 4px; border-radius: 5px; background: var(--panel2); text-align: center; font-family: var(--num); font-weight: 700; font-size: 13px; }

.seg { display: flex; gap: 4px; padding: 3px; background: var(--panel2); border-radius: var(--r); flex-wrap: wrap; }
.seg button { flex: 1; min-height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--line2); color: var(--ink); font-weight: 700; }
.small-seg button { min-height: 32px; font-size: 12.5px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.tabs button { min-height: 38px; padding: 0 12px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }

.field { display: flex; flex-direction: column; gap: 4px; }
.field span { font-size: 12px; color: var(--muted); }
.field input, .field select { min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel); }
.field.inline { flex-direction: row; align-items: center; gap: 8px; }
.field.inline input, .field.inline select { min-height: 36px; }

/* --- 로딩 --- */
.loading { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.wordmark { display: flex; flex-direction: column; gap: 4px; }
.loading .wordmark { align-items: center; }
.wm-main { font-family: var(--font); font-weight: 700; font-size: clamp(26px, 5vw, 40px); letter-spacing: -0.02em; text-wrap: balance; }
.wm-main::before { content: ''; display: inline-block; width: 0.42em; height: 0.42em; margin-right: 0.3em; background: var(--accent); transform: rotate(45deg) translateY(-0.12em); border-radius: 2px; }
.wm-sub { font-family: var(--num); font-size: 13px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }
.load-bar { width: min(320px, 70vw); height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.load-bar span { display: block; height: 100%; background: var(--accent); transition: width 0.24s ease; }
.load-step { margin: 0; color: var(--muted); font-size: 12.5px; }

/* --- 메인 메뉴 --- */
.menu { flex: 1; position: relative; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: center; gap: 32px; padding-block: 20px; overflow: auto; }
.menu-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.field-art { position: absolute; left: -2%; bottom: -8%; width: min(60%, 520px); color: var(--line); pointer-events: none; }
.menu-left { position: relative; display: flex; flex-direction: column; gap: 14px; max-width: 30em; }
.menu-tag { margin: 0; color: var(--muted); font-size: 14px; text-wrap: balance; }
.menu-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.set-row .btn { align-self: flex-start; }
.menu-list { position: relative; display: flex; flex-direction: column; gap: 8px; }
.menu-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 16px; min-height: 52px; border-radius: var(--r); border: 1px solid var(--line2); background: var(--panel); text-align: left; }
.menu-btn span { font-size: 16px; font-weight: 700; }
.menu-btn small { color: var(--muted); font-size: 12px; }
.menu-btn.primary { border-color: var(--accent); background: var(--accent-soft); }
.menu-btn.primary span { color: var(--accent); }
.menu-btn:hover:not(:disabled) { border-color: var(--muted); }
.menu-btn:disabled { opacity: 0.5; }

/* --- 화면 틀 --- */
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.screen-head { display: flex; align-items: center; gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); flex: none; }
.screen-head h1 { margin: 0; font-size: 17px; }
.head-note { margin-left: auto; color: var(--muted); font-size: 12px; }
.sub-head { display: flex; align-items: flex-end; gap: 12px; justify-content: space-between; flex-wrap: wrap; flex: none; }
.sub-head .muted { padding-bottom: 10px; }
.scroll-body { flex: 1; min-height: 0; overflow: auto; padding-block: 10px 16px; display: flex; flex-direction: column; gap: 10px; }
.empty { margin: 24px 0; color: var(--muted); text-align: center; }

/* --- 새 게임 --- */
.ng-body { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: minmax(150px, 0.7fr) minmax(0, 2fr); grid-template-rows: minmax(0, 1fr); gap: 20px; padding-block: 12px; }
.ng-coach, .ng-teams { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ng-teams { min-height: 0; }
.team-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px; }
.team-card { display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 3px; padding: 8px 10px; border-radius: var(--r); border: 1px solid var(--line2); background: var(--panel); text-align: left; min-height: 0; min-width: 0; overflow: hidden; }
.tc-top { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; }
.team-card.on { border-color: var(--accent); background: var(--accent-soft); }
.tc-region { font-size: 11.5px; color: var(--muted); }
.tc-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
.tc-rank { font-size: 14px; font-weight: 700; color: var(--accent); }
.tc-areas { display: flex; flex-wrap: wrap; gap: 0 6px; font-size: 11px; color: var(--muted); }
.ng-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); flex: none; }
.ng-foot p { margin: 0; }

/* --- 상단 바 --- */
.topbar { display: flex; align-items: center; gap: 14px; padding-block: 8px; border-bottom: 1px solid var(--line); flex: none; min-width: 0; }
.tb-team { display: flex; flex-direction: column; min-width: 0; }
.tb-team strong { font-size: 15px; white-space: nowrap; }
.tb-team .muted { font-size: 11.5px; white-space: nowrap; }
.tb-stats { display: flex; gap: 16px; margin-left: auto; align-items: center; min-width: 0; overflow: hidden; }
.tb-item { display: flex; flex-direction: column; line-height: 1.2; white-space: nowrap; }
.tb-item small { font-size: 10.5px; color: var(--muted); }
.tb-item b { font-size: 13.5px; }
.tb-item b.num { font-size: 16px; }
.meter { display: block; width: 72px; height: 6px; margin-top: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--good); }
.meter span.bad { background: var(--bad); }
.tb-actions { display: flex; gap: 6px; flex: none; }

/* --- 게임창 메인 --- */
.hub { gap: 10px; }
.tiles { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; border: 1px solid var(--line2); background: var(--panel); text-align: left; min-height: 0; overflow: hidden; }
.tile:hover { border-color: var(--muted); }
.tile-head { display: flex; flex-direction: column; gap: 1px; }
.tile-title { font-size: 16px; font-weight: 700; }
.tile-sub { font-size: 11.5px; color: var(--muted); }
.tile-label { font-size: 11px; color: var(--muted); letter-spacing: 0.03em; }
.tile-line { font-size: 12.5px; }
.mini-table { display: flex; flex-direction: column; }
.mt-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 6px; align-items: center; min-height: 22px; font-size: 13px; }
.mt-row .num { font-size: 14px; }
.mt-row.mine { color: var(--accent); font-weight: 700; }
.mt-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.rank-cell { display: flex; flex-direction: column; align-items: center; padding: 6px 0; border-radius: 8px; background: var(--bg); }
.rank-cell b { font-size: 22px; line-height: 1; }
.rank-cell small { font-size: 11px; color: var(--muted); }
.tile.planned { background: transparent; border-style: dashed; }
.planned-list { display: flex; flex-direction: column; gap: 3px; color: var(--muted); font-size: 12.5px; }
.planned-list span::before { content: '· '; }
.progress { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 14px; margin-bottom: 10px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent-soft); flex: none; flex-wrap: wrap; }
.pg-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.pg-label { font-size: 11.5px; color: var(--accent); font-weight: 700; }
.pg-match { font-size: 15px; font-weight: 700; }
.pg-match b { font-size: 18px; margin: 0 4px; }
.pg-actions { display: flex; gap: 8px; align-items: center; }

/* --- 표 --- */
.table-wrap { overflow-x: auto; min-width: 0; }
table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.data th { font-weight: 500; color: var(--muted); font-size: 11.5px; text-align: center; padding: 6px 6px; border-bottom: 1px solid var(--line2); white-space: nowrap; position: sticky; top: 0; background: var(--bg); }
table.data td { text-align: center; padding: 6px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data .l { text-align: left; }
table.data tr.mine td { background: var(--accent-soft); }
table.data tr.mine td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
table.data tr.cutline td { border-bottom: 1px dashed var(--accent); }
table.data tr.divider td { text-align: left; color: var(--muted); font-size: 11.5px; padding-top: 12px; }
table.data tr.dim-row td { color: var(--muted); }
.last10 { display: inline-flex; gap: 2px; }
.last10 i { font-style: normal; font-size: 10.5px; width: 16px; text-align: center; border-radius: 3px; background: var(--panel2); }
.last10 i.W { color: var(--good); }
.last10 i.L { color: var(--bad); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-btn { min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line2); background: transparent; color: var(--muted); }
.chip-btn.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.db-filters { display: flex; gap: 12px; flex-wrap: wrap; }
.entry-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.entry-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.plist li { display: grid; grid-template-columns: 34px minmax(0, auto) 1fr; gap: 8px; align-items: center; min-height: 32px; border-bottom: 1px solid var(--line); }
.plist li .small { text-align: right; }
.planned-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.planned-card { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: var(--r); border: 1px dashed var(--line2); }

/* --- 수동 경기 --- */
.game { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scoreboard { display: grid; grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding-block: 6px; border-bottom: 1px solid var(--line); flex: none; }
.sb-team { display: flex; align-items: center; gap: 10px; justify-content: flex-end; min-width: 0; }
.sb-team.right { justify-content: flex-start; }
.sb-team span { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.sb-team.mine span { color: var(--accent); }
.sb-team b { font-size: 30px; line-height: 1; min-width: 28px; text-align: center; }
.sb-mid { display: flex; align-items: center; gap: 12px; padding: 2px 12px; border-radius: 8px; background: #05080b; border: 1px solid var(--line); }
.sb-inning { font-size: 18px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.sb-count { display: flex; flex-direction: column; gap: 1px; }
.lamp-row { display: flex; align-items: center; gap: 3px; }
.lamp-row i { font-style: normal; font-family: var(--num); font-size: 10px; width: 9px; color: var(--muted); }
.lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--line2); }
.lamp.b.on { background: var(--good); box-shadow: 0 0 6px var(--good); }
.lamp.s.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.lamp.o.on { background: var(--bad); box-shadow: 0 0 6px var(--bad); }

.game-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1fr) minmax(0, 1.05fr); grid-template-rows: minmax(0, 1fr); gap: 12px; padding-block: 8px; }
.g-field, .g-info, .g-cmd { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
.g-cmd { overflow-y: auto; }
.g-cmd .sub-list { flex: 1 1 auto; }
.g-field { justify-content: center; }
.diamond { width: 100%; height: auto; max-height: 100%; min-height: 0; flex: 1; }
.d-name { fill: var(--ink); font-size: 12px; font-weight: 700; font-family: var(--font); }
.d-sub { fill: var(--muted); font-size: 10.5px; font-family: var(--font); }
.field-cap { text-align: center; }
.moment { display: flex; flex-direction: column; gap: 1px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel); font-size: 12px; flex: none; }
.moment b { color: var(--accent); }
.moment.stopped { border-color: var(--accent); background: var(--accent-soft); }
.duel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; flex: none; }
.duel-card { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 10px; background: var(--panel); min-width: 0; }
.duel-card small { color: var(--muted); font-size: 11px; }
.duel-card strong { font-size: 13.5px; display: flex; align-items: center; gap: 6px; min-width: 0; }
.duel-card strong .pname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.stam { display: block; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 2px; }
.stam span { display: block; height: 100%; background: var(--good); }
.stam span.warn { background: var(--warn); }
.stam span.bad { background: var(--bad); }
.reps { display: flex; flex-wrap: wrap; gap: 3px; }
.reps i { font-style: normal; font-size: 10.5px; padding: 0 5px; border-radius: 4px; background: var(--panel2); color: var(--muted); }
.rt { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.duel-card > .muted.small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rt b { font-family: var(--num); font-size: 13px; }
.pitchbox { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 8px; align-items: center; flex: none; }
.zone { width: 116px; height: 126px; }
.zone circle { stroke: var(--bg); stroke-width: 1; }
.zone text { font-size: 8.5px; font-weight: 700; font-family: var(--num); fill: #0b1015; }
.zone .p-ball circle { fill: var(--opp); }
.zone .p-strike circle { fill: var(--accent); }
.zone .p-foul circle { fill: #c7a6f2; }
.zone .p-play circle { fill: var(--good); }
.zone .p-hbp circle { fill: var(--bad); }
.zone .newest circle { stroke: var(--ink); stroke-width: 1.6; animation: pop 0.35s ease-out; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.plog { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; font-size: 12px; min-width: 0; }
.plog li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plog .num { color: var(--muted); }
.plog b { font-weight: 700; }
.plog b.p-ball { color: var(--opp); }
.plog b.p-strike { color: var(--accent); }

  .cmd { min-height: 30px; }
  .hint { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .advance { padding-block: 3px 4px; }
  .adv-btns .btn { min-height: 34px; }
  .adv-btns .btn.big { min-height: 34px; }
  .pchip { min-height: 24px; }
}

/* 아주 낮은 가로 화면 (인앱 브라우저 가로, 높이 300px 이하) */
@media (orientation: landscape) and (max-height: 300px) {
  .ng-coach .field > span, .ng-coach > p { display: none; }
  .ng-coach .seg button { padding: 0 3px; font-size: 11.5px; letter-spacing: -0.02em; }
  .ng-coach .field input { min-height: 32px; }
  .team-card { padding: 4px 7px; gap: 1px; }
  .tc-region, .tc-areas { font-size: 10px; }
  .tc-rank { font-size: 12.5px; }
  .cmd { min-height: 26px; font-size: 11.5px; }
  .cmd-grid { gap: 3px; }
  .g-cmd .tabs button { min-height: 28px; }
  .hint { display: none; }
  .duel-card .rt { display: none; }
}

/* 로테이션 점검·운영 방침 */
.strategy { display: flex; flex-direction: column; gap: 12px; }
.st-block { display: flex; flex-direction: column; gap: 6px; }
.cycle-list, .rot-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.cycle-list li { display: grid; grid-template-columns: 26px 44px minmax(110px, auto) minmax(0, 1fr); align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px; background: var(--panel2); font-size: 12.5px; }
.res-dot { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--line2); }
.res-dot.W { background: var(--accent); color: var(--accent-ink); }
.res-dot.L { background: #3a2226; color: #f19b9b; }
.cl-starter { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rot-list li { display: grid; grid-template-columns: 22px minmax(120px, 1.2fr) minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px; background: var(--panel2); font-size: 12.5px; }
.rot-n { color: var(--accent); font-weight: 700; text-align: center; }
.rot-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rot-ctl { display: flex; gap: 4px; align-items: center; }
.rot-ctl .icon-btn { min-width: 30px; min-height: 30px; padding: 0; }
.rot-ctl select, .st-closer select { min-height: 30px; max-width: 150px; background: var(--panel); color: var(--ink); border: 1px solid var(--line2); border-radius: 8px; padding: 0 6px; font: inherit; font-size: 12px; }
.st-closer { align-self: flex-start; }
.st-actions { display: flex; justify-content: flex-end; }
.strategy .set-row { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 12px; }
.strategy .seg { flex-wrap: nowrap; }
@media (orientation: landscape) and (max-height: 420px) {
  .rot-list li, .cycle-list li { padding: 2px 6px; }
  .strategy .set-row { padding-block: 4px; }
}

/* 이닝별 기록 */
.inning-log { display: flex; flex-direction: column; gap: 8px; }
.il-tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
.il-tabs button { flex: none; min-width: 40px; min-height: 32px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line2); background: transparent; color: var(--muted); font-variant-numeric: tabular-nums; }
.il-tabs button.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.il-half h4 { margin: 0 0 4px; font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
.il-sum { margin-left: auto; font-size: 11.5px; color: var(--muted); font-weight: 500; }
.il-sum.scored { color: var(--accent); font-weight: 700; }
.il-items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.il-pa > button { width: 100%; display: flex; align-items: baseline; gap: 4px; text-align: left; padding: 6px 8px; border: 0; border-radius: 8px; background: var(--panel2); color: var(--ink); font: inherit; font-size: 12.5px; }
.il-pa.good > button { box-shadow: inset 3px 0 0 var(--accent); }
.il-pa.live > button { box-shadow: inset 3px 0 0 var(--opp); }
.il-who { white-space: nowrap; }
.il-what { flex: 1; min-width: 0; }
.il-rbi { color: var(--accent); font-weight: 700; }
.il-note { padding: 2px 8px; font-size: 12px; color: var(--muted); }
.il-note.in { color: var(--opp); }
.il-pitches { list-style: none; margin: 2px 0 4px; padding: 4px 8px 4px 16px; display: flex; flex-direction: column; gap: 2px; border-left: 1px solid var(--line2); }
.il-pitches li { display: grid; grid-template-columns: 22px minmax(90px, auto) 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
.il-n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 11px; font-weight: 700; color: #0b1015; }
.il-n.b { background: #5fbf8a; }
.il-n.s { background: var(--accent); }
.il-n.x { background: var(--opp); }

/* 베타 데이터 수집 안내 */
.consent-backdrop { position: fixed; inset: 0; z-index: 25; display: flex; align-items: center; justify-content: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); background: rgba(3, 5, 8, 0.72); }
.consent { width: min(480px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; border-radius: 14px; border: 1px solid var(--line2); background: var(--panel); }
.consent h2 { margin: 0; font-size: 16px; }
.consent p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.55; }
.consent-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
